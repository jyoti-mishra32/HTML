<!DOCTYPE html>
<html>
<head>
  <title>HTML Lists</title>   <!--HTML lists allow web developers to group a set of related items in lists.-->
</head>
<body>
  <!--Unordered HTML List-->
  <h2>An Unordered HTML List</h2>
  <ul>            <!--Defines an unordered list-->
    <li>Coffee</li>
    <li>Tea</li>
    <li>Milk</li>
  </ul>

  <!--Ordered HTML List-->
  <h2>An Ordered HTML List</h2>
  <ol>      <!--Defines an ordered list-->
    <li>Coffee</li>  <!--Defines a list Item-->
    <li>Tea</li>
    <li>Milk</li>
  </ol>

  <!--Description List-->
  <h2>An Description Lists</h2>
  <dl>    <!--Defines a description list-->
    <dt>Coffee</dt>   <!--Defines a term in a description list-->
    <dd>- black hot drink</dd>    <!--Describes the term in a description list-->
    <dt>Milk</dt>
    <dd>- white cold drink</dd>
  </dl>

  <!--Disc Bullets-->
  <h2>Unordered List with Disc Bullets</h2>
  <ul style="list-style-type:disc;">
  <li>Coffee</li>
  <li>Tea</li>
  <li>Milk</li>
  </ul>
</body>
</html>
