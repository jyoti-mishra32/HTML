<!DOCTYPE html>
<html>
<head>
  <title>CSS Margin</title>  <!--The CSS margin property defines a margin (space) outside the border-->
<style>
p {
  border: 2px solid powderblue;
  margin: 50px;
}
</style>
</head>
<body>

<h1>This is a heading</h1>

<p>This is a paragraph.</p>
<p>This is a paragraph.</p>
<p>This is a paragraph.</p>

</body>
</html>
