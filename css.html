<!DOCTYPE html>
<html>
<head>
  <title>CSS</title>  <!--CSS stands for Cascading Style Sheets.
                          CSS saves a lot of work. It can control the layout of multiple web pages all at once.-->
</head>
<body>
  <!--Inline CSS: An inline CSS uses the style attribute of an HTML element.-->
  <h1 style="color:blue;">A Blue Heading</h1>
  <p style="color:red;">A red paragraph.</p>

<!--Internal CSS: An internal CSS is defined in the <head> section of an HTML page, within a <style> element.-->

<style>
body {background-color: powderblue;}
h1   {color: blue;}
p    {color: red;}
</style>
</head>
<body>

<h1>This is a heading</h1>
<p>This is a paragraph.</p>

<!-External CSS: An external style sheet is used to define the style for many HTML pages.-->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>This is a heading</h1>
<p>This is a paragraph.</p>

</body>
</html
